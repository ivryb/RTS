<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dune77 Terrain Topology Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #17120e;
        color: #f3e7d4;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 900px; min-height: 100vh; background: #17120e; }
      button, input, select { font: inherit; }
      button, input, select {
        border: 1px solid #6a4c35;
        border-radius: 7px;
        padding: 8px 10px;
        background: #2c2018;
        color: #f7ead5;
      }
      button { cursor: pointer; }
      button:hover { background: #493322; }
      input { width: 100px; }
      select { width: 76px; }
      main { width: min(1400px, calc(100% - 40px)); margin: 0 auto; padding: 26px 0 44px; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
      h1 { margin: 0 0 7px; font-size: 26px; }
      h2 { margin: 0 0 12px; font-size: 15px; color: #ffe7c5; }
      p { margin: 0; color: #cdbda8; line-height: 1.5; }
      .question { max-width: 760px; }
      .prototype-label { color: #f0a85f; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      .seed-controls { display: flex; align-items: end; flex-wrap: wrap; gap: 8px; }
      .mode-switcher { display: flex; gap: 4px; padding: 3px; border: 1px solid #4a3729; border-radius: 9px; background: #211912; }
      .mode-switcher button { border: 0; padding: 7px 12px; background: transparent; }
      .mode-switcher button[aria-selected="true"] { color: #21170f; background: #f0bd7d; }
      .field { display: grid; gap: 4px; color: #bfae99; font-size: 11px; font-weight: 700; text-transform: uppercase; }
      .workspace { display: grid; grid-template-columns: minmax(720px, 1fr) 310px; gap: 16px; }
      .map-panel, .panel { border: 1px solid #4a3729; border-radius: 12px; background: #211912; box-shadow: 0 22px 70px #0005; }
      .map-panel { overflow: hidden; }
      .map-stage { position: relative; aspect-ratio: 1; background: #39271c; }
      #terrain-2d, #terrain-rendered, #terrain-plan { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
      #terrain-2d { image-rendering: auto; }
      [hidden] { display: none !important; }
      .map-footer { display: flex; justify-content: space-between; gap: 16px; padding: 11px 14px; border-top: 1px solid #4a3729; color: #bfae99; font-size: 12px; }
      .legend { display: flex; gap: 13px; }
      .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .swatch { width: 11px; height: 11px; border-radius: 50%; }
      aside { align-self: start; }
      .panel { padding: 15px; }
      .status { display: grid; grid-template-columns: 1fr auto; gap: 9px 15px; margin: 0; font-size: 13px; }
      .status dt { color: #a99782; }
      .status dd { margin: 0; color: #fff0d9; font-weight: 700; text-align: right; }
      #last-change { margin-top: 13px; padding-top: 12px; border-top: 1px solid #463326; color: #d7c4ad; font-size: 12px; }
      .note { margin-top: 16px; padding: 12px 14px; border-left: 3px solid #b86f38; background: #2b2018; color: #cdbda8; font-size: 12px; line-height: 1.5; }
      .plan-route { stroke: #fff0c5; stroke-width: 1.6; opacity: .62; }
      .plan-route.ramp { stroke: #72e0c4; stroke-width: 2.4; }
      .plan-route.choke { stroke-dasharray: 3 2; }
      .plan-cliff { stroke: #2c1710; stroke-width: 1.15; opacity: .55; }
      .node { stroke: #21150e; stroke-width: 1.1; }
      .node.lowland { fill: #f0cf9f; }
      .node.mesa { fill: #72e0c4; }
      .node.mountain { fill: #392019; }
      .node-label { fill: #fff5e4; font: 700 5px system-ui; paint-order: stroke; stroke: #24170f; stroke-width: 1.4px; pointer-events: none; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="question">
          <span class="prototype-label">Graph + organic terrain prototype</span>
          <h1>Terrain generation</h1>
          <p>Inspect the authored gameplay graph in 2D or render the exact same organically shaped height field.</p>
        </div>
        <div class="seed-controls">
          <div class="mode-switcher" role="tablist" aria-label="Preview mode">
            <button type="button" data-preview-mode="plan" role="tab">2D plan</button>
            <button type="button" data-preview-mode="rendered" role="tab">Rendered terrain</button>
          </div>
          <label class="field">Players<select id="players"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
          <button id="previous-seed" aria-label="Previous seed">−</button>
          <label class="field">Seed<input id="seed" type="number" value="77" /></label>
          <button id="next-seed" aria-label="Next seed">+</button>
          <button id="random-seed">Random</button>
        </div>
      </header>
      <section class="workspace">
        <div class="map-panel">
          <div class="map-stage">
            <canvas id="terrain-2d" width="225" height="225"></canvas>
            <svg id="terrain-plan" role="img" aria-label="Generated terrain plan"></svg>
            <canvas id="terrain-rendered" hidden></canvas>
          </div>
          <div class="map-footer">
            <span id="map-summary"></span>
            <div class="legend">
              <span><i class="swatch" style="background:#c69a68"></i>Low</span>
              <span><i class="swatch" style="background:#9e6743"></i>Walkable mesa</span>
              <span><i class="swatch" style="background:#603d2f"></i>Blocked mountain</span>
            </div>
          </div>
        </div>
        <aside><section class="panel"><h2>Current terrain plan</h2><dl id="status" class="status"></dl><div id="last-change"></div></section></aside>
      </section>
      <div id="preview-note" class="note"></div>
    </main>
    <script type="module" src="/prototypes/terrain-topology/preview.ts"></script>
  </body>
</html>
